<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="theme-toggle" type="button">Dark Mode</button>
    <span id="hint-count">Hints used: 0</span>
    <span id="timer" aria-label="Elapsed time">00:00</span>
    <button id="check-solution">Check Solution</button>
    <span id="message"></span>
  </div>
  <section id="score-entry" hidden>
    <label for="player-name">Name</label>
    <input id="player-name" type="text" maxlength="30">
    <button id="submit-score" type="button">Save Score</button>
  </section>
  <section id="leaderboard">
    <h2>Top 10</h2>
    <table>
      <thead>
        <tr><th>Rank</th><th>Name</th><th>Time</th><th>Difficulty</th><th>Hints</th></tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
